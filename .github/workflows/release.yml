# Релиз по тегу vX.Y.Z: сборка, подпись, самотест, .dmg, GitHub Release.
#
# Кандидаты в релиз: тег вида vX.Y.Z-rc.N. Публикуются как pre-release, поэтому НЕ попадают
# в /releases/latest — проверка обновлений их не видит, и обычным пользователям пункт
# «Скачать обновление» не загорается. Версия в Info.plist при этом остаётся X.Y.Z:
# суффикс -rc.N живёт только в теге.
#
# Требует два секрета репозитория (Settings → Secrets and variables → Actions):
#   MACOS_CERT_P12      — base64 от экспортированного .p12 «Voica Self-Signed»
#   MACOS_CERT_PASSWORD — пароль, заданный при экспорте .p12
# Сертификат импортируется во временный keychain и умирает вместе с раннером.
#
# Ручной прогон (workflow_dispatch) собирает и тестирует, но релиз не публикует.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Импорт сертификата подписи
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12_BASE64" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "::error::Секреты MACOS_CERT_P12 / MACOS_CERT_PASSWORD не заданы — см. шапку workflow"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S "apple-tool:,apple:" \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Версия в Info.plist должна совпадать с тегом
        if: github.ref_type == 'tag'
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          # У кандидата в релиз тег длиннее версии на суффикс -rc.N — сравниваем без него.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BASE="${TAG_VERSION%%-*}"
          if [ "$VERSION" != "$BASE" ]; then
            echo "::error::Info.plist: $VERSION, тег: $GITHUB_REF_NAME — поднимите версию перед тегом"
            exit 1
          fi

      # ⚠️ Кандидат обязан ПОКАЗЫВАТЬ, что он кандидат: About читает версию из бандла, и без
      # этого шага rc.1, rc.2 и финал выглядели бы одинаково — «Version 0.9.19». Тестировщик
      # тогда не может ответить, что именно у него стоит, а ради этого кандидаты и заведены.
      # Штампуем ПОСЛЕ сверки версии: сверка идёт по базовой части, здесь пишем полную.
      - name: Кандидату — полную версию с суффиксом в About
        if: github.ref_type == 'tag' && contains(github.ref_name, '-')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $TAG_VERSION" Resources/Info.plist
          echo "About покажет: $TAG_VERSION"

      - name: Сборка, .dmg и самотест
        run: |
          ./scripts/package.sh
          codesign -dvv build/Voica.app 2>&1 | grep "Voica Self-Signed" \
            || { echo "::error::Приложение подписано не сертификатом Voica Self-Signed"; exit 1; }
          ./build/Voica.app/Contents/MacOS/Voica --test-all

      - name: Публикация релиза
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Всё, кроме заголовка релиза, идёт по БАЗОВОЙ версии: и раздел CHANGELOG, и имя dmg
          # (package.sh берёт имя из Info.plist, где суффикса -rc.N нет).
          BASE="${TAG_VERSION%%-*}"
          # выдёргиваем раздел этой версии из CHANGELOG в описание релиза
          awk -v ver="$BASE" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            /^## \[/ { flag = 0 }
            flag' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          # заголовок релиза — из строки CHANGELOG «## [VER] — ДАТА — Тема»:
          # берём «Тему» после второго « — ». Нет темы → просто «vX.Y.Z».
          LABEL="$(grep -m1 "^## \[$BASE\]" CHANGELOG.md \
            | awk -F ' — ' 'NF>=3 { out=$3; for (i=4;i<=NF;i++) out=out FS $i; print out }')"
          TITLE="$GITHUB_REF_NAME"
          [ -n "$LABEL" ] && TITLE="$GITHUB_REF_NAME — $LABEL"
          # Кандидат в релиз (тег с суффиксом) публикуется как pre-release: GitHub не отдаёт
          # такие в /releases/latest, значит проверка обновлений их не увидит.
          PRERELEASE=""
          case "$TAG_VERSION" in
            *-*) PRERELEASE="--prerelease"
                 { echo "> ⚠️ Кандидат в релиз ($GITHUB_REF_NAME). Проверка обновлений его не"
                   echo "> показывает: это сборка для проверки, а не выпуск."
                   echo
                   cat "$RUNNER_TEMP/notes.md"
                 } > "$RUNNER_TEMP/notes.rc.md"
                 mv "$RUNNER_TEMP/notes.rc.md" "$RUNNER_TEMP/notes.md" ;;
          esac
          gh release create "$GITHUB_REF_NAME" $PRERELEASE \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "build/Voica-$TAG_VERSION.dmg"
